<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2; url=index.html">
  <title>Wei-Ping Chan</title>
  <meta name="description" content="Wei-Ping Chan — Exploratory Data Scientist and Interdisciplinary Researcher." />
  <link rel="canonical" href="https://wpchanwork.github.io/wei-ping_chan/index.html">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0c1525;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }
    .bg {
      position: absolute; inset: 0;
      background: url('imgs/web/splash-cover.jpg') center/cover no-repeat;
      opacity: 1;
    }
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 40% 45%, transparent 30%, rgba(12,21,37,.5) 100%);
    }
    .content {
      position: relative; z-index: 1;
      text-align: center;
      animation: fadeUp 0.8s ease-out both;
    }
    .enter {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      transition: color 0.2s;
    }
    .enter:hover { color: rgba(255,255,255,0.7); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (min-width: 768px) {
      h1 { font-size: 4.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <a href="index.html" class="enter">Enter site →</a>
  </div>
</body>
</html>
